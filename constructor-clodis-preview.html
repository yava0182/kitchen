  <script>
    const event = new Event('Glob_ready');
    let glob = '';
    window.PP_EMBEDDED_PREVIEW = true; // ✅ Включено - пропускает антидебаг код в main_core_v2.js
    window.__PP_DEBUG = true;
    
    // 🔧 PATCH: Add timeout to fetch to prevent hanging
    (function() {
      const originalFetch = window.fetch;
      const FETCH_TIMEOUT = 10000; // 10 seconds
      
      window.fetch = function(...args) {
        console.log('[Clodis-preview] fetch with timeout:', args[0]);
        
        return Promise.race([
          originalFetch.apply(this, args).then(response => {
            console.log('[Clodis-preview] fetch success:', args[0], response.status);
            return response;
          }).catch(err => {
            console.error('[Clodis-preview] fetch error:', args[0], err);
            throw err;
          }),
          new Promise((_, reject) => 
            setTimeout(() => {
              console.error('[Clodis-preview] fetch TIMEOUT:', args[0]);
              reject(new Error('Fetch timeout after ' + FETCH_TIMEOUT + 'ms'));
            }, FETCH_TIMEOUT)
          )
        ]);
      };
      
      console.log('[Clodis-preview] fetch wrapper installed with', FETCH_TIMEOUT, 'ms timeout');
    })();
    
    // 🔧 Глобальная заглушка для controls (OrbitControls создаётся движком позже)
    window.controls = null;

    window.addEventListener('error', (e) => {
      try { console.error('❌ [Clodis-preview] window.onerror', e?.message || e); } catch {}
      const el = document.getElementById('status');
      if (el) el.textContent = 'ERROR: ' + (e?.message || String(e));
    });
    window.addEventListener('unhandledrejection', (e) => {
      try { console.error('❌ [Clodis-preview] unhandledrejection', e?.reason || e); } catch {}
      const el = document.getElementById('status');
      if (el) el.textContent = 'PROMISE ERROR: ' + String(e?.reason || e);
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/three@0.137.5/examples/js/loaders/FBXLoader.js"></script>
  <script>
    // 🔧 PATCH: Обработка ошибок FBXLoader, чтобы они не блокировали инициализацию
    if (typeof THREE !== 'undefined' && THREE.FBXLoader) {
      const OriginalFBXLoader = THREE.FBXLoader;
      THREE.FBXLoader = function(manager) {
        const loader = new OriginalFBXLoader(manager);
        const originalLoad = loader.load.bind(loader);
        
        loader.load = function(url, onLoad, onProgress, onError) {
          const wrappedOnError = onError || function(error) {
            console.warn('[Clodis-preview] ⚠️ FBX загрузка не удалась (это нормально для моков):', url, error?.message || error);
            // Создаем пустую группу с минимальной геометрией вместо ошибки
            if (onLoad) {
              try {
                const emptyGroup = new THREE.Group();
                emptyGroup.name = 'EmptyFBX_' + url.split('/').pop();
                // Добавляем пустой mesh, чтобы группа была видима
                const geometry = new THREE.BoxGeometry(0.001, 0.001, 0.001);
                const material = new THREE.MeshBasicMaterial({ visible: false });
                const mesh = new THREE.Mesh(geometry, material);
                emptyGroup.add(mesh);
                // Устанавливаем children как массив для совместимости
                if (!emptyGroup.children) {
                  emptyGroup.children = [];
                }
                onLoad(emptyGroup);
              } catch (e) {
                console.error('[Clodis-preview] ❌ Ошибка при создании пустой группы:', e);
                // Если даже это не работает, просто вызываем onLoad с пустой группой
                if (onLoad) {
                  const emptyGroup = new THREE.Group();
                  emptyGroup.name = 'EmptyFBX_' + url.split('/').pop();
                  emptyGroup.children = [];
                  onLoad(emptyGroup);
                }
              }
            }
          };
          
          // Обертываем onLoad, чтобы обработать ошибки парсинга
          const wrappedOnLoad = onLoad ? function(object) {
            try {
              // Проверяем, что объект валиден и имеет children
              if (object && object.children && Array.isArray(object.children) && object.children.length > 0) {
                // Проверяем, что первый child имеет geometry
                if (object.children[0] && object.children[0].geometry) {
                  onLoad(object);
                } else {
                  console.warn('[Clodis-preview] ⚠️ FBX загружен, но children[0].geometry отсутствует, создаем валидную структуру');
                  // Создаем валидную структуру с geometry
                  const emptyGeometry = new THREE.BoxGeometry(0.001, 0.001, 0.001);
                  const emptyMaterial = new THREE.MeshBasicMaterial({ visible: false });
                  const emptyMesh = new THREE.Mesh(emptyGeometry, emptyMaterial);
                  object.children = [emptyMesh];
                  onLoad(object);
                }
              } else {
                console.warn('[Clodis-preview] ⚠️ FBX загружен, но children пуст или невалиден, создаем валидную структуру');
                // Создаем валидную структуру
                if (!object.children) {
                  object.children = [];
                }
                const emptyGeometry = new THREE.BoxGeometry(0.001, 0.001, 0.001);
                const emptyMaterial = new THREE.MeshBasicMaterial({ visible: false });
                const emptyMesh = new THREE.Mesh(emptyGeometry, emptyMaterial);
                object.children.push(emptyMesh);
                onLoad(object);
              }
            } catch (e) {
              console.error('[Clodis-preview] ❌ Ошибка в onLoad:', e);
              wrappedOnError(e);
            }
          } : undefined;
          
          return originalLoad(url, wrappedOnLoad, onProgress, wrappedOnError);
        };
        
        return loader;
      };
      console.log('[Clodis-preview] ✅ FBXLoader обернут для обработки ошибок');
    }
  </script>

      const ppOk = !!(window.pp && window.pp.three && typeof window.pp.three.mount === 'function');
      setStatus(`Waiting engine… sc:${scOk} pp:${ppOk}`);
      // Убрал лишний лог - засорял консоль
      // console.log('[Clodis-preview] diag', { scOk, ppOk, diagCount });
      if (scOk && ppOk) {
        setStatus('Engine ready. Waiting for module…');
        clearInterval(diagTimer);
      }
      if (diagCount > 40) clearInterval(diagTimer);
    }, 250);

    // Apply module params when received (non-blocking)
    window.__pp_lastModuleParams = null;
    window.addEventListener('message', (ev) => {
      const data = ev.data;
      if (!data || typeof data !== 'object') return;
      if (data.type !== 'pp:setModule') return;
      window.__pp_lastModuleParams = data.params || null;
      scheduleApply();
    });

    let __applyScheduled = false;
    function scheduleApply() {
      if (__applyScheduled) return;
      __applyScheduled = true;

      let frames = 0;
      const maxFrames = 360;
      const tick = () => {
        frames++;
        const params = window.__pp_lastModuleParams;
        const scOk = (window.__pp_get_sc ? window.__pp_get_sc() : window.sc) && typeof (window.__pp_get_sc ? window.__pp_get_sc() : window.sc).add_object === 'function';
        const ppOk = window.pp && window.pp.three && typeof window.pp.three.mount === 'function';

        if (params && scOk && ppOk) {
          try {
            if (status) status.textContent = 'Applying module…';
            if (window.global_options) {
              if (typeof window.global_options.sizes_visible !== 'undefined') window.global_options.sizes_visible = true;
              if (typeof window.global_options.common_sizes_visible !== 'undefined') window.global_options.common_sizes_visible = true;
            }

            window.pp.three.mount();
            window.__embeddedModule = window.sc.add_object('module', params, false);
            if (typeof single_preview === 'function' && window.__embeddedModule) single_preview(true, window.__embeddedModule);
            if (window.pp && typeof window.pp.render === 'function') window.pp.render();
            if (status) status.textContent = 'OK';
          } catch (e) {
            console.error('❌ [Clodis-preview] apply failed', e);
            if (status) status.textContent = 'Apply failed: ' + (e?.message || String(e));
          } finally {
            __applyScheduled = false;
          }
          return;
        }

        if (frames >= maxFrames) {
          __applyScheduled = false;
          if (status) status.textContent = 'Waiting for engine… (pp/sc not ready yet)';
          return;
        }
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }
  </script>
</body>
