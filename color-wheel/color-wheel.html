        function createSegment(startAngle, endAngle, innerRadius, outerRadius, color) {
            const centerX = CENTER;
const centerY = CENTER;

    const d = getSegmentPath(startAngle, endAngle, innerRadius, outerRadius);

    // Создаем паттерн для текстуры
    const patternId = `pattern-${color.id}`;
    const pattern = document.createElementNS("http://www.w3.org/2000/svg", "pattern");
    pattern.setAttribute('id', patternId);
    pattern.setAttribute('patternUnits', 'userSpaceOnUse');
    pattern.setAttribute('width', '40');
    pattern.setAttribute('height', '40');
    pattern.setAttribute('patternTransform', 'rotate(45)');

    const image = document.createElementNS("http://www.w3.org/2000/svg", "image");
    image.setAttribute('href', color.texture);
    image.setAttribute('width', '40');
    image.setAttribute('height', '40');
    image.setAttribute('preserveAspectRatio', 'xMidYMid slice');

    pattern.appendChild(image);
    svg.appendChild(pattern);

    // Создаем второй паттерн для шкафа (без поворота)
    const wardrobePatternId = `wardrobe-pattern-${color.id}`;
    const wardrobePattern = document.createElementNS("http://www.w3.org/2000/svg", "pattern");
    wardrobePattern.setAttribute('id', wardrobePatternId);
    wardrobePattern.setAttribute('patternUnits', 'userSpaceOnUse');
    wardrobePattern.setAttribute('width', '40');
    wardrobePattern.setAttribute('height', '40');

    const wardrobeImage = document.createElementNS("http://www.w3.org/2000/svg", "image");
    wardrobeImage.setAttribute('href', color.texture);
    wardrobeImage.setAttribute('width', '40');
    wardrobeImage.setAttribute('height', '40');
    wardrobeImage.setAttribute('preserveAspectRatio', 'xMidYMid slice');

    wardrobePattern.appendChild(wardrobeImage);
    svg.appendChild(wardrobePattern);

    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute('d', d);
    path.setAttribute('fill', `url(#${patternId})`);
    path.setAttribute('stroke', '#fff');
    path.setAttribute('stroke-width', '0');
    path.style.cursor = 'pointer';
    path.style.transition = 'transform 0.2s';
    path.setAttribute('data-color-id', color.id);

    path.onmouseenter = () => {
        path.setAttribute('d', getSegmentPath(startAngle, endAngle, innerRadius, outerRadius + 10));
        const words = color.name.split(' ');
        if (words.length > 1) {
            centerTextLine1.textContent = words[0];
            centerTextLine2.textContent = words.slice(1).join(' ');
        } else {
            centerTextLine1.textContent = color.name;
            centerTextLine2.textContent = '';
        }
        previewWardrobeColor(color);
    };

    path.onmouseleave = () => {
        path.setAttribute('d', getSegmentPath(startAngle, endAngle, innerRadius, outerRadius));
        centerTextLine1.textContent = '';
        centerTextLine2.textContent = '';
        updateWardrobeColors();
    };

    path.onclick = () => selectColor(color);

    return path;
}

function getSegmentPath(startAngle, endAngle, innerRadius, outerRadius) {
       const centerX = CENTER;
       const centerY = CENTER;
       const innerStartX = centerX + innerRadius * Math.cos(startAngle);
       const innerStartY = centerY + innerRadius * Math.sin(startAngle);
       const innerEndX = centerX + innerRadius * Math.cos(endAngle);
       const innerEndY = centerY + innerRadius * Math.sin(endAngle);
       const outerStartX = centerX + outerRadius * Math.cos(startAngle);
       const outerStartY = centerY + outerRadius * Math.sin(startAngle);
       const outerEndX = centerX + outerRadius * Math.cos(endAngle);
       const outerEndY = centerY + outerRadius * Math.sin(endAngle);
       const largeArcFlag = endAngle - startAngle > Math.PI ? 1 : 0;
       return [
           `M ${innerStartX} ${innerStartY}`,
           `L ${outerStartX} ${outerStartY}`,
           `A ${outerRadius} ${outerRadius} 0 ${largeArcFlag} 1 ${outerEndX} ${outerEndY}`,
           `L ${innerEndX} ${innerEndY}`,
           `A ${innerRadius} ${innerRadius} 0 ${largeArcFlag} 0 ${innerStartX} ${innerStartY}`,
           'Z'
       ].join(' ');
   }
            
        function getLuminance(hex) {
            const rgb = hex.match(/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i).slice(1).map(x => parseInt(x, 16) / 255);
            return 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2];
        }

        function selectColor(color, event) {
    // Если нет активного слота — подсветить следующий пустой и показать надпись
    if (!activeSlot) {
        const slots = Array.from(selectedColorsContainer.children);
        const nextEmptySlot = slots.find(slot => !slot.classList.contains('filled'));
        if (nextEmptySlot) {
            // Снимаем подсветку со всех
            slots.forEach(slot => slot.classList.remove('active'));
            // Подсвечиваем и показываем надпись
            nextEmptySlot.classList.add('active');
            const oldHtml = nextEmptySlot.innerHTML;
            nextEmptySlot.innerHTML = '<div style="width:100%;text-align:center;color:#333;font-weight:bold;font-size:15px;">Сначала нажмите сюда!</div>';
            nextEmptySlot.style.backgroundColor = '#d4f7d4';
            setTimeout(() => {
                nextEmptySlot.classList.remove('active');
                nextEmptySlot.style.backgroundColor = '';
                nextEmptySlot.innerHTML = oldHtml;
                updateSelectedColors();
            }, 2000);
        }
        return;
    }

    const slotIndex = Array.from(selectedColorsContainer.children).indexOf(activeSlot);
    selectedColors[slotIndex] = color;
    fixedPreviewColor = null;

    // После выбора делаем этот слот активным для шкафа
    const slotType = activeSlot.getAttribute('data-type');
    if (slotType === 'facade') {
        activeFacadeSlot = slotIndex;
    } else {
        activeBodySlot = slotIndex;
    }

    activeSlot = null;
    updateSelectedColors();
    updateWardrobeColors();
    updateSubmitButtonState();
}

function updateSelectedColors() {
    const slots = selectedColorsContainer.children;
    Array.from(slots).forEach((slot, index) => {
        const color = selectedColors[index];
        const slotType = slot.getAttribute('data-type');
        const defaultText = slotType === 'facade' 
            ? 'для выбора нажми <strong>здесь</strong><br>выберите цвет из круга для фасада'
            : 'для выбора нажми <strong>здесь</strong><br>выберите цвет из круга для корпуса';

        slot.classList.remove('filled', 'active');
        slot.innerHTML = '';

        if (color) {
            const preview = document.createElement('div');
            preview.className = 'color-preview';
            preview.style.background = `url(${color.texture})`;

            const nameDiv = document.createElement('div');
            nameDiv.className = 'color-name';
            nameDiv.textContent = `${color.name} (${slotType === 'facade' ? 'фасад' : 'корпус'})`;

            const deleteIcon = document.createElement('div');
            deleteIcon.className = 'delete-icon';
            deleteIcon.onclick = (e) => {
                e.stopPropagation();
                selectedColors[index] = null;
                if (slotType === 'facade' && activeFacadeSlot === index) activeFacadeSlot = null;
                if (slotType === 'body' && activeBodySlot === index) activeBodySlot = null;
                if (activeSlot === slot) activeSlot = null;
                updateSelectedColors();
                updateSubmitButtonState();
                updateWardrobeColors();
            };

            slot.appendChild(preview);
            slot.appendChild(nameDiv);
            slot.appendChild(deleteIcon);

            slot.classList.add('filled');
        } else {
            slot.innerHTML = `
                <div class="default-text" style="white-space: pre-line">${defaultText}</div>
            `;
        }

        // Подсветка для всех слотов (фасад и корпус)
        // Подсветка для активного слота (пустого или заполненного)
if (activeSlot === slot) {
    slot.classList.add('active');
} else if (
    (slotType === 'facade' && activeFacadeSlot === index) ||
    (slotType === 'body' && activeBodySlot === index)
) {
    slot.classList.add('active');
}

        // Клик по слоту
        slot.onclick = () => {
    if (color) {
        // Клик по заполненному — фиксируем предпросмотр
        fixedPreviewColor = color;
        // Подсвечиваем только этот слот
        if (slotType === 'facade') {
            activeFacadeSlot = index;
        } else {
            activeBodySlot = index;
        }
        updateWardrobeColors();
        updateSelectedColors();
    } else {
        // Клик по пустому — выбор для круга
        activeSlot = slot;
        fixedPreviewColor = null;
        updateSelectedColors();
        updateWardrobeColors();
    }
};
    });
}

function updateSubmitButtonState() {

        function previewSlotColor(color, slotType) {
            const facadeElements = document.querySelectorAll('[id^="Fasad"]');
            const korpusElement = document.getElementById('Korpus');
            
            if (slotType === 'facade') {
                facadeElements.forEach(element => {

                });
            } else {

                });
            }
        }

        function updateWardrobeColors() {
    const facadeElements = document.querySelectorAll('[id^="Fasad"]');
    const korpusElement = document.getElementById('Korpus');

    // Если есть зафиксированный предпросмотр
    if (fixedPreviewColor) {
        // Определяем тип слота по активному слоту
        // Если fixedPreviewColor выбран через клик по слоту, ищем его тип
        let slotType = null;
        // Найти индекс fixedPreviewColor в selectedColors
        const idx = selectedColors.findIndex(c => c && c.id === fixedPreviewColor.id);
        if (idx !== -1) {
            slotType = selectedColorsContainer.children[idx].getAttribute('data-type');
        }
        if (slotType === 'facade') {
            facadeElements.forEach(element => {
                element.setAttribute('fill', `url(#wardrobe-pattern-${fixedPreviewColor.id})`);
            });
        } else if (slotType === 'body') {
            korpusElement.setAttribute('fill', `url(#wardrobe-pattern-${fixedPreviewColor.id})`);
            const paths = korpusElement.getElementsByTagName('path');
            Array.from(paths).forEach(path => {
                path.setAttribute('fill', `url(#wardrobe-pattern-${fixedPreviewColor.id})`);
            });
        }
        return;
    }

    // --- Вот тут меняем! ---
    // Используем активный слот, а не первый заполненный
    let facadeIdx = activeFacadeSlot;
    let bodyIdx = activeBodySlot;

    // Если нет активного — fallback на первый заполненный
    if (facadeIdx == null) {
        facadeIdx = Array.from(selectedColorsContainer.children).findIndex(
            (slot, idx) => slot.getAttribute('data-type') === 'facade' && selectedColors[idx]
        );
    }
    if (bodyIdx == null) {
        bodyIdx = Array.from(selectedColorsContainer.children).findIndex(
            (slot, idx) => slot.getAttribute('data-type') === 'body' && selectedColors[idx]
        );
    }

    // Фасады
    if (facadeIdx != null && selectedColors[facadeIdx]) {
        facadeElements.forEach(element => {
            element.setAttribute('fill', `url(#wardrobe-pattern-${selectedColors[facadeIdx].id})`);
        });
    } else {
        facadeElements.forEach(element => {
            element.setAttribute('fill', 'white');
        });
    }

    // Корпус
    if (bodyIdx != null && selectedColors[bodyIdx]) {
        korpusElement.setAttribute('fill', `url(#wardrobe-pattern-${selectedColors[bodyIdx].id})`);
        const paths = korpusElement.getElementsByTagName('path');
        Array.from(paths).forEach(path => {
            path.setAttribute('fill', `url(#wardrobe-pattern-${selectedColors[bodyIdx].id})`);
        });
    } else {
        korpusElement.setAttribute('fill', '#D9D9D9');
        const paths = korpusElement.getElementsByTagName('path');
        Array.from(paths).forEach(path => {
            path.setAttribute('fill', '#D9D9D9');
        });
    }
}

        function previewWardrobeColor(color) {
            const facadeElements = document.querySelectorAll('[id^="Fasad"]');
            const korpusElement = document.getElementById('Korpus');
            
            const emptyFacadeSlot = Array.from(selectedColorsContainer.children)
                .find(slot => slot.getAttribute('data-type') === 'facade' && !slot.classList.contains('filled'));
            
            const emptyBodySlot = Array.from(selectedColorsContainer.children)
                .find(slot => slot.getAttribute('data-type') === 'body' && !slot.classList.contains('filled'));

            if (emptyFacadeSlot) {
                facadeElements.forEach(element => {
                    element.setAttribute('fill', `url(#wardrobe-pattern-${color.id})`);
                });
            } else if (emptyBodySlot) {
                korpusElement.setAttribute('fill', `url(#wardrobe-pattern-${color.id})`);
                const paths = korpusElement.getElementsByTagName('path');
                Array.from(paths).forEach(path => {
                    path.setAttribute('fill', `url(#wardrobe-pattern-${color.id})`);
                });
            }
        }

        function showToast(message, x = null, y = null) {
    const toast = document.createElement('div');
    toast.textContent = message;
    toast.style.position = 'fixed';
    toast.style.background = '#333';
    toast.style.color = '#fff';
    toast.style.padding = '14px 24px';
    toast.style.borderRadius = '8px';
    toast.style.zIndex = 9999;
    toast.style.fontSize = '16px';
    toast.style.pointerEvents = 'none';
    toast.style.transition = 'opacity 0.2s';
    toast.style.opacity = '0.95';

    // Если координаты переданы — показываем у курсора, иначе в углу
    if (x !== null && y !== null) {
        toast.style.left = x + 15 + 'px';
        toast.style.top = y + 15 + 'px';
    } else {
        toast.style.top = '30px';
        toast.style.right = '30px';
    }

    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2000);
    submitButton.addEventListener('click', function() {
    // Собираем выбранные цвета
    const selected = selectedColors
        .map((color, idx) => color ? ({
            id: color.id,
            name: color.name,
            type: selectedColorsContainer.children[idx].getAttribute('data-type')
        }) : null)
        .filter(Boolean);

    if (!selected.length) {
        alert('Выберите хотя бы один образец!');
        return;
    }

    fetch('/wp-admin/admin-ajax.php', {
        method: 'POST',
        credentials: 'same-origin',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: 'action=add_samples_to_cart&samples=' + encodeURIComponent(JSON.stringify(selected))
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            // Редиректим в корзину WooCommerce
            window.location.href = '/cart/';
        } else {
            alert('Ошибка добавления в корзину');
        }
    });
});
}
