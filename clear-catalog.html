image.png<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Очистка каталога</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background: #dc3545;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin: 10px 5px;
    }
    button:hover {
      background: #c82333;
    }
    .info {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 4px;
      margin: 20px 0;
    }
    .success {
      background: #d4edda;
      color: #155724;
      padding: 10px;
      border-radius: 4px;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <h1>Очистка каталога комнаты</h1>
  
  <div class="info">
    <p>Этот скрипт удалит все элементы из каталогов комнаты (все ключи localStorage, начинающиеся с "catalog_").</p>
    <p><strong>Внимание:</strong> Это действие нельзя отменить!</p>
  </div>

  <button onclick="clearCatalog()">Удалить все каталоги</button>
  <button onclick="showCatalogInfo()">Показать информацию о каталогах</button>

  <div id="result"></div>

  <script>
    function clearCatalog() {
      const resultDiv = document.getElementById('result');
      const keysToRemove = [];
      
      // Находим все ключи, начинающиеся с "catalog_"
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith('catalog_')) {
          keysToRemove.push(key);
        }
      }
      
      if (keysToRemove.length === 0) {
        resultDiv.innerHTML = '<div class="success">Каталоги не найдены. Нечего удалять.</div>';
        return;
      }
      
      // Удаляем найденные ключи
      keysToRemove.forEach(key => {
        localStorage.removeItem(key);
      });
      
      resultDiv.innerHTML = `
        <div class="success">
          <strong>Успешно!</strong><br>
          Удалено каталогов: ${keysToRemove.length}<br>
          Удаленные ключи:<br>
          <ul>
            ${keysToRemove.map(k => `<li>${k}</li>`).join('')}
          </ul>
        </div>
      `;
    }
    
    function showCatalogInfo() {
      const resultDiv = document.getElementById('result');
      const catalogs = [];
      
      // Находим все ключи, начинающиеся с "catalog_"
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith('catalog_')) {
          try {
            const data = JSON.parse(localStorage.getItem(key));
            const count = Array.isArray(data) ? data.length : 0;
            catalogs.push({
              key: key,
              count: count,
              items: count > 0 ? data.map(item => item.name || 'Без названия').slice(0, 5) : []
            });
          } catch (e) {
            catalogs.push({
              key: key,
              count: 'Ошибка парсинга',
              items: []
            });
          }
        }
      }
      
      if (catalogs.length === 0) {
        resultDiv.innerHTML = '<div class="info">Каталоги не найдены.</div>';
        return;
      }
      
      let html = '<div class="info"><strong>Найденные каталоги:</strong><ul>';
      catalogs.forEach(catalog => {
        html += `<li><strong>${catalog.key}</strong>: ${catalog.count} элементов`;
        if (catalog.items.length > 0) {
          html += `<br>Примеры: ${catalog.items.join(', ')}${catalog.count > 5 ? '...' : ''}`;
        }
        html += '</li>';
      });
      html += '</ul></div>';
      
      resultDiv.innerHTML = html;
    }
    
    // Показываем информацию при загрузке
    window.onload = function() {
      showCatalogInfo();
    };
  </script>
</body>
</html>
